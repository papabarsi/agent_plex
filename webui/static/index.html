<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-2: #242424;
    --border: #2a2a2a;
    --text: #e4e4e4;
    --text-muted: #888;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --user-bg: #1e293b;
    --agent-bg: #1a1a2e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  header .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
  }

  header .status .dot.offline { background: #ef4444; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 720px;
    padding: 14px 18px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    background: var(--user-bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    background: var(--agent-bg);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }

  .message .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    color: var(--text-muted);
  }

  .message.user .label { color: #60a5fa; }
  .message.assistant .label { color: var(--accent); }

  .typing {
    align-self: flex-start;
    padding: 14px 18px;
    background: var(--agent-bg);
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 14px;
    color: var(--text-muted);
    display: none;
  }

  .typing.visible { display: block; }

  .typing span {
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 12px;
  }

  #input-area input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  #input-area input:focus { border-color: var(--accent); }
  #input-area input::placeholder { color: var(--text-muted); }

  #input-area button {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  #input-area button:hover { background: var(--accent-hover); }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

  .welcome {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
  }

  .welcome h2 {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome p { font-size: 14px; line-height: 1.6; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }

  .suggestions button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .suggestions button:hover {
    border-color: var(--accent);
    background: var(--agent-bg);
  }
</style>
</head>
<body>

<header>
  <h1>Media Agent</h1>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <h2>Media Assistant</h2>
    <p>Search for movies and TV shows, check your Plex library, or add media to download.</p>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <div class="typing" id="typing">
    <span>.</span><span>.</span><span>.</span> Thinking
  </div>
</div>

<div id="input-area">
  <input type="text" id="input" placeholder="Ask about movies or TV shows..." autocomplete="off" autofocus>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const typingEl = document.getElementById("typing");
  const welcomeEl = document.getElementById("welcome");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  let sessionId = null;
  let sending = false;

  const suggestions = [
    "What's recently been added to Plex?",
    "Find me a good sci-fi thriller",
    "What's airing this week?",
    "What's currently downloading?",
    "Find me a new drama series",
    "Browse my movie library",
  ];

  // Initialize suggestions
  const sugEl = document.getElementById("suggestions");
  suggestions.forEach((text) => {
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.onclick = () => { inputEl.value = text; sendMessage(); };
    sugEl.appendChild(btn);
  });

  async function checkHealth() {
    try {
      const resp = await fetch("/api/health");
      const data = await resp.json();
      const agentStatus = data.agent;
      if (agentStatus && agentStatus.status === "ok" && agentStatus.agent_ready) {
        statusDot.classList.remove("offline");
        statusText.textContent = "Media Agent connected";
      } else {
        statusDot.classList.add("offline");
        statusText.textContent = "Media Agent offline";
      }
    } catch {
      statusDot.classList.add("offline");
      statusText.textContent = "Disconnected";
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(role, text) {
    if (welcomeEl) welcomeEl.style.display = "none";

    const div = document.createElement("div");
    div.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Media Agent";

    const content = document.createElement("div");
    content.textContent = text;

    div.appendChild(label);
    div.appendChild(content);

    messagesEl.insertBefore(div, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    sending = true;
    sendBtn.disabled = true;
    inputEl.value = "";

    addMessage("user", text);
    typingEl.classList.add("visible");
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
        }),
      });

      const data = await resp.json();

      if (data.error) {
        addMessage("assistant", `Error: ${data.error}`);
      } else {
        sessionId = data.session_id;
        addMessage("assistant", data.response);
      }
    } catch (err) {
      addMessage("assistant", `Connection error: ${err.message}`);
    } finally {
      typingEl.classList.remove("visible");
      sending = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
